[workspace]
members = [
    "crates/tidyup-core",
    "crates/tidyup-platform",
    "crates/tidyup-storage",
    "crates/tidyup-cli",
    "crates/tidyup-testkit",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
