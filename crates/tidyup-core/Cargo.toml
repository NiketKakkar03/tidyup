[package]
name = "tidyup-core"
version = "0.1.0"
edition = "2024"
description = "Planning and validation core for the TidyUp file organization workflow."
license = "MIT"
repository = "https://github.com/NiketKakkar03/tidyup"
readme = "../../README.md"
keywords = ["cleanup", "organize", "planning", "filesystem", "undo"]
categories = ["filesystem", "command-line-utilities"]

[lib]
path = "src/lib.rs"

[dependencies]
tidyup-platform = { path = "../tidyup-platform" }

[dev-dependencies]
tidyup-testkit = { path = "../tidyup-testkit" }

[lints]
workspace = true
