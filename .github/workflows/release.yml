name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-artifacts:
    name: Build Artifact (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p tidyup-cli

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/tidyup dist/tidyup
          tar -czf tidyup-macos.tar.gz -C dist tidyup
          shasum -a 256 tidyup-macos.tar.gz > tidyup-macos.tar.gz.sha256

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidyup-macOS
          path: |
            tidyup-macos.tar.gz
            tidyup-macos.tar.gz.sha256
