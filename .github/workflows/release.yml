name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-intel

    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --release --locked -p tidyup-cli --target "${{ matrix.target }}"

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: ./scripts/import-apple-certificate.sh

      - name: Sign binary
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "target/${{ matrix.target }}/release/tidyup"

      - name: Package artifact
        run: ./scripts/package-macos.sh "${{ matrix.target }}" "${{ matrix.label }}"

      - name: Notarize artifact
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: xcrun notarytool submit "dist/tidyup-${{ matrix.label }}.tar.gz" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidyup-${{ matrix.label }}
          path: |
            dist/tidyup-${{ matrix.label }}.tar.gz
            dist/tidyup-${{ matrix.label }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tidyup-macos-*
          path: dist
          merge-multiple: true

      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
